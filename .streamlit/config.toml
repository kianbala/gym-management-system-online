# این فایل باید در ریشه پروژه و دقیقاً در مسیر .streamlit/config.toml قرار بگیرد.

[theme]
base = "dark"
primaryColor = "#38BDF8"
backgroundColor = "#0B1120"
secondaryBackgroundColor = "#111A2E"
textColor = "#E2E8F0"
font = "sans serif"

[client]
# نوار بالای صفحه را برای کاربران ساده می‌کند
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
